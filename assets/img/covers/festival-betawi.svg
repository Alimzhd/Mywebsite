  <ellipse cx="291.6146068600938" cy="169.53612629324198" rx="314.2654825374484" ry="217.56864147260785" fill="#d98527"/>
  <ellipse cx="1042.5506986491382" cy="598.8835135102272" rx="278.09648659080267" ry="179.0850736014545" fill="#f4c27a"/>
</g>
<g class="motif"><g fill="none" stroke="#d98527"><circle cx="360" cy="400" r="140" stroke-width="1.4" opacity="0.60" stroke-dasharray="none"/><circle cx="360" cy="400" r="236" stroke-width="1.9" opacity="0.50" stroke-dasharray="none"/><circle cx="360" cy="400" r="332" stroke-width="2.4" opacity="0.40" stroke-dasharray="14 22"/><circle cx="360" cy="400" r="428" stroke-width="2.9" opacity="0.30" stroke-dasharray="none"/></g><circle cx="360" cy="400" r="86" fill="#f4c27a" opacity=".8"/></g>
