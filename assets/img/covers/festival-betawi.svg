<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
<defs>
  <linearGradient id="bg" gradientTransform="rotate(121 .5 .5)">
    <stop offset="0" stop-color="#3d1230"/>
    <stop offset=".55" stop-color="#7c1f52"/>
    <stop offset="1" stop-color="#3d1230"/>
  </linearGradient>
  <radialGradient id="glow" cx=".78" cy=".18" r=".8">
    <stop offset="0" stop-color="#d98527" stop-opacity=".9"/>
    <stop offset="1" stop-color="#d98527" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx=".16" cy=".9" r=".7">
    <stop offset="0" stop-color="#f4c27a" stop-opacity=".55"/>
    <stop offset="1" stop-color="#f4c27a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="shade" x1="0" y1=".45" x2="0" y2="1">
    <stop offset="0" stop-color="#000" stop-opacity="0"/>
