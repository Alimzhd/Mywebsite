  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<rect width="1200" height="800" fill="url(#glow)"/>
<rect width="1200" height="800" fill="url(#glow2)"/>
<g filter="url(#soft)" opacity=".55">
  <ellipse cx="229.62386952713132" cy="281.4966934081167" rx="284.6469920128584" ry="159.11330907605588" fill="#8a7434"/>
  <ellipse cx="958.2359573245049" cy="655.6812566146255" rx="261.43733508884907" ry="198.469731612131" fill="#d9c48a"/>
</g>
<g class="motif"><rect x="-200" y="-200" width="110" height="1300" fill="#8a7434" opacity="0.10" transform="rotate(18 600 400)"/><rect x="100" y="-200" width="150" height="1300" fill="#d9c48a" opacity="0.14" transform="rotate(18 600 400)"/><rect x="400" y="-200" width="190" height="1300" fill="#8a7434" opacity="0.17" transform="rotate(18 600 400)"/><rect x="700" y="-200" width="230" height="1300" fill="#d9c48a" opacity="0.21" transform="rotate(18 600 400)"/><rect x="1000" y="-200" width="270" height="1300" fill="#8a7434" opacity="0.24" transform="rotate(18 600 400)"/></g>
