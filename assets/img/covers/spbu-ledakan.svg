<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
<defs>
  <linearGradient id="bg" gradientTransform="rotate(111 .5 .5)">
    <stop offset="0" stop-color="#231312"/>
    <stop offset=".55" stop-color="#5c2118"/>
    <stop offset="1" stop-color="#231312"/>
  </linearGradient>
  <radialGradient id="glow" cx=".78" cy=".18" r=".8">
    <stop offset="0" stop-color="#e2602a" stop-opacity=".9"/>
    <stop offset="1" stop-color="#e2602a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx=".16" cy=".9" r=".7">
    <stop offset="0" stop-color="#f5b23c" stop-opacity=".55"/>
    <stop offset="1" stop-color="#f5b23c" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="shade" x1="0" y1=".45" x2="0" y2="1">
    <stop offset="0" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity=".34"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="70"/>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<rect width="1200" height="800" fill="url(#glow)"/>
<rect width="1200" height="800" fill="url(#glow2)"/>
<g filter="url(#soft)" opacity=".55">
  <ellipse cx="335.7938988599926" cy="193.54688071645796" rx="235.07052540779114" ry="168.0564593989402" fill="#e2602a"/>
  <ellipse cx="912.8183553740382" cy="699.7568562999368" rx="239.0035279095173" ry="173.7983486894518" fill="#f5b23c"/>
</g>
<g class="motif"><rect x="-200" y="-200" width="110" height="1300" fill="#e2602a" opacity="0.10" transform="rotate(18 600 400)"/><rect x="100" y="-200" width="150" height="1300" fill="#f5b23c" opacity="0.14" transform="rotate(18 600 400)"/><rect x="400" y="-200" width="190" height="1300" fill="#e2602a" opacity="0.17" transform="rotate(18 600 400)"/><rect x="700" y="-200" width="230" height="1300" fill="#f5b23c" opacity="0.21" transform="rotate(18 600 400)"/><rect x="1000" y="-200" width="270" height="1300" fill="#e2602a" opacity="0.24" transform="rotate(18 600 400)"/></g>
<rect width="1200" height="800" fill="url(#shade)"/>
<rect width="1200" height="800" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/>
</svg>
