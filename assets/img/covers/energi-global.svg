<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
<defs>
  <linearGradient id="bg" gradientTransform="rotate(152 .5 .5)">
    <stop offset="0" stop-color="#0c1b33"/>
    <stop offset=".55" stop-color="#173a63"/>
    <stop offset="1" stop-color="#0c1b33"/>
  </linearGradient>
  <radialGradient id="glow" cx=".78" cy=".18" r=".8">
    <stop offset="0" stop-color="#2b7f8f" stop-opacity=".9"/>
    <stop offset="1" stop-color="#2b7f8f" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx=".16" cy=".9" r=".7">
