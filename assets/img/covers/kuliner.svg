<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
<defs>
  <linearGradient id="bg" gradientTransform="rotate(156 .5 .5)">
    <stop offset="0" stop-color="#3a1210"/>
    <stop offset=".55" stop-color="#7c241c"/>
    <stop offset="1" stop-color="#3a1210"/>
  </linearGradient>
  <radialGradient id="glow" cx=".78" cy=".18" r=".8">
    <stop offset="0" stop-color="#d9842a" stop-opacity=".9"/>
    <stop offset="1" stop-color="#d9842a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx=".16" cy=".9" r=".7">
